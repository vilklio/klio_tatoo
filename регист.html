<div class="container">
  <h1>Регистрация нового профиля</h1>

  <main>
    <section id="register-profile">
      <h2>Создание аккаунта</h2>
      <form action="profile.html" method="post">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" placeholder="Введите имя" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Введите email" required>

        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль" required>

        <label for="confirm-password">Повторите пароль:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Повторите пароль" required>

        <button type="submit">Зарегистрироваться</button>
      <p>Уже есть аккаунт? <a href="вход.html">Войти</a></p>
      </form>
    </section>
  </main>
</div>
